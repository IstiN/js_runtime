name: Engines
on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tool/build_all.sh host
      - run: node --test 'test/engine/**/*.test.mjs'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Build Android ABIs
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash tool/build_all.sh armeabi-v7a arm64-v8a x86_64
