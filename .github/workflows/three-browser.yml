name: Three browser

on: [push, pull_request]

jobs:
  three-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build host engine backend
        run: bash tool/build_all.sh host
      - name: Clone pinned three.js
        run: |
          THREE_COMMIT=$(python3 -c "import json; print(json.load(open('libs/three/source-pin.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/mrdoob/three.js.git /tmp/jsr-three-r186
          git -C /tmp/jsr-three-r186 checkout "$THREE_COMMIT"
      - name: Verify committed bundle against pinned rebuild
        run: node libs/three/build.mjs --source /tmp/jsr-three-r186 --verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Three tests
        # Node 22 treats a bare directory argument as a module; let the
        # shell expand the test files.
        run: JSR_REQUIRE_BROWSER=1 node --test test/three/*.test.js
